name: Native AOT packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-aot-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: [self-hosted, gitsail, "${{ matrix.rid }}"]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Native AOT release package - Windows x64
            rid: win-x64
          - label: Native AOT release package - Windows Arm64
            rid: win-arm64
          - label: Native AOT release package - Linux x64
            rid: linux-x64
          - label: Native AOT release package - Linux Arm64
            rid: linux-arm64
          - label: Native AOT release package - Linux musl x64
            rid: linux-musl-x64
          - label: Native AOT release package - Linux musl Arm64
            rid: linux-musl-arm64
          - label: Native AOT release package - macOS x64
            rid: osx-x64
          - label: Native AOT release package - macOS Arm64
            rid: osx-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Verify repository automation
        run: >-
          dotnet run --file eng/verify-repository-automation.cs --
          --repository-root .

      - name: Verify native runner
        run: >-
          dotnet run --file eng/verify-native-runner.cs --
          --rid ${{ matrix.rid }}

      - name: Restore
        run: dotnet restore GitSail.slnx

      - name: Build
        run: dotnet build GitSail.slnx --configuration Release --no-restore

      - name: Test with Microsoft Testing Platform
        run: >-
          dotnet test --solution GitSail.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory artifacts/test-results/${{ matrix.rid }}
          --
          --report-trx
          --minimum-expected-tests 1

      - name: Publish Native AOT payload
        run: >-
          dotnet publish src/GitSail/GitSail.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          --output artifacts/publish/${{ matrix.rid }}

      - name: Verify Native AOT payload
        run: >-
          dotnet run --file eng/verify-native-payload.cs --
          --rid ${{ matrix.rid }}
          --publish-directory artifacts/publish/${{ matrix.rid }}

      - name: Pack RID tool
        run: >-
          dotnet pack src/GitSail/GitSail.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          --output artifacts/packages/${{ matrix.rid }}

      - name: Pack installable tool pointer
        run: >-
          dotnet pack src/GitSail/GitSail.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages/${{ matrix.rid }}

      - name: Install and run staged tool package
        run: >-
          dotnet run --file eng/verify-tool-package.cs --
          --rid ${{ matrix.rid }}
          --package-directory artifacts/packages/${{ matrix.rid }}

      - name: Upload package, executable, and test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/packages/${{ matrix.rid }}/*.nupkg
            artifacts/publish/${{ matrix.rid }}
            artifacts/test-results/${{ matrix.rid }}
          if-no-files-found: error
