name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Verify repository automation
        run: >-
          dotnet run --file eng/verify-repository-automation.cs --
          --repository-root .

      - name: Restore
        run: dotnet restore GitSail.slnx

      - name: Build default configuration
        run: dotnet build GitSail.slnx --no-restore

      - name: Test default configuration with Microsoft Testing Platform
        run: >-
          dotnet test --solution GitSail.slnx
          --no-build
          --no-restore
          --results-directory artifacts/test-results/${{ matrix.os }}/Debug
          --
          --report-trx
          --minimum-expected-tests 1

      - name: Build Release
        run: dotnet build GitSail.slnx --configuration Release --no-restore

      - name: Test Release with Microsoft Testing Platform
        run: >-
          dotnet test --solution GitSail.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory artifacts/test-results/${{ matrix.os }}/Release
          --
          --report-trx
          --minimum-expected-tests 1

      - name: Audit unit-test host
        run: >-
          dotnet run --project tests/GitSail.UnitTests
          --configuration Release
          --no-build
          --
          --info

      - name: Audit service-test host
        run: >-
          dotnet run --project tests/GitSail.ServiceTests
          --configuration Release
          --no-build
          --
          --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/${{ matrix.os }}
          if-no-files-found: error

  native-aot-linux-x64:
    name: Native AOT package - Linux x64
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Prepare glibc 2.27 sysroot
        run: >-
          dotnet run --file eng/prepare-glibc-sysroot.cs --
          --rid linux-x64
          --output-directory artifacts/sysroots/linux-x64
          --evidence-directory artifacts/evidence/linux-x64

      - name: Restore host Native AOT payload
        run: dotnet restore src/GitSail/GitSail.csproj --runtime linux-x64

      - name: Publish host Native AOT payload
        run: >-
          dotnet publish src/GitSail/GitSail.csproj
          --configuration Release
          --runtime linux-x64
          --property:GitSailGlibcSysRootRoot=${{ github.workspace }}/artifacts/sysroots/linux-x64
          --no-restore
          --output artifacts/publish/linux-x64

      - name: Run host Native AOT payload
        run: >-
          dotnet run --file eng/verify-native-payload.cs --
          --rid linux-x64
          --publish-directory artifacts/publish/linux-x64

      - name: Pack host RID tool
        run: >-
          dotnet pack src/GitSail/GitSail.csproj
          --configuration Release
          --runtime linux-x64
          --property:GitSailGlibcSysRootRoot=${{ github.workspace }}/artifacts/sysroots/linux-x64
          --no-restore
          --output artifacts/packages/linux-x64

      - name: Pack installable tool pointer
        run: >-
          dotnet pack src/GitSail/GitSail.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages/linux-x64

      - name: Generate release evidence
        run: >-
          dotnet run --file eng/generate-native-evidence.cs --
          --rid linux-x64
          --publish-directory artifacts/publish/linux-x64
          --package-directory artifacts/packages/linux-x64
          --intermediate-directory src/GitSail/obj/Release/net10.0/linux-x64
          --evidence-directory artifacts/evidence/linux-x64

      - name: Verify RHEL 8 compatibility
        run: >-
          dotnet run --file eng/verify-rhel8-compatibility.cs --
          --rid linux-x64
          --publish-directory artifacts/publish/linux-x64
          --evidence-directory artifacts/evidence/linux-x64

      - name: Install and run staged tool package
        run: >-
          dotnet run --file eng/verify-tool-package.cs --
          --rid linux-x64
          --package-directory artifacts/packages/linux-x64

      - name: Upload host package and payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-native-linux-x64
          path: |
            artifacts/packages/linux-x64/*.nupkg
            artifacts/publish/linux-x64
            artifacts/evidence/linux-x64
          if-no-files-found: error

