name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore GitSail.slnx

      - name: Build
        run: dotnet build GitSail.slnx --configuration Release --no-restore

      - name: Test with Microsoft Testing Platform
        run: >-
          dotnet test --solution GitSail.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory artifacts/test-results/${{ matrix.os }}
          --
          --report-trx
          --minimum-expected-tests 1

      - name: Audit unit-test host
        run: >-
          dotnet run --project tests/GitSail.UnitTests
          --configuration Release
          --no-build
          --
          --info

      - name: Audit service-test host
        run: >-
          dotnet run --project tests/GitSail.ServiceTests
          --configuration Release
          --no-build
          --
          --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/${{ matrix.os }}
          if-no-files-found: error

  pointer-package:
    name: Pointer package
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore src/GitSail/GitSail.csproj

      - name: Pack pointer
        run: >-
          dotnet pack src/GitSail/GitSail.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages/pointer

      - name: Upload pointer package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-pointer
          path: artifacts/packages/pointer/*.nupkg
          if-no-files-found: error
